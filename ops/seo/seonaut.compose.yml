services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ephemeral-seo-root
      MYSQL_DATABASE: seonaut
      MYSQL_USER: seonaut
      MYSQL_PASSWORD: ephemeral-seo-user
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -pephemeral-seo-root]
      interval: 5s
      retries: 40
  app:
    build: ../../.seo-sources/seonaut
    ports: ['127.0.0.1:9000:9000']
    depends_on:
      db:
        condition: service_healthy
    environment:
      SEONAUT_DATABASE_PASSWORD: ephemeral-seo-user
      SEONAUT_SERVER_URL: http://localhost:9000
    command: /app/seonaut
