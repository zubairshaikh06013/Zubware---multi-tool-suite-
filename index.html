<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Google Tag Manager (Production only) -->
    <script>
      (function() {
        try {
          var host = window.location.hostname;
          if (host === 'www.zubware.com' || host === 'zubware.com') {
            (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
            j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
            'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
            })(window,document,'script','dataLayer','GTM-MRXVGW45');
          }
        } catch(e) {}
      })();
    </script>
    <!-- End Google Tag Manager -->
    <!-- SEO fallback stays readable without JavaScript; hide it before first paint
         when the interactive app can boot, avoiding a different homepage flash. -->
    <script>
      document.documentElement.classList.add('zubware-js');
      window.setTimeout(function () {
        if (document.getElementById('seo-prerender')) {
          document.documentElement.classList.remove('zubware-js');
        }
      }, 12000);
    </script>
    <style>html.zubware-js #seo-prerender { display: none !important; }</style>
    <meta name="theme-color" content="#4f46e5" />
    <title>Zubware — Free Online Multi-Tool Suite</title>
    <meta name="description" content="Explore 300+ free online tools for PDFs, images, video, developers, calculators, and productivity. Fast browser-based utilities, with local processing on supported tools." />
    <link rel="canonical" href="https://www.zubware.com/" />
    <link rel="icon" type="image/png" href="/apple-touch-icon.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- OpenGraph / Facebook -->
    <meta property="og:site_name" content="Zubware" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.zubware.com/" />
    <meta property="og:title" content="Zubware — Free Online Multi-Tool Suite" />
    <meta property="og:description" content="Explore 300+ free online tools for PDF, images, video, developers, calculators, and productivity." />
    <meta property="og:image" content="https://www.zubware.com/social-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zubware — free online tools for everyday tasks" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zubware — Free Online Multi-Tool Suite" />
    <meta name="twitter:description" content="Free multi-tool suite for creators, developers, designers, and students." />
    <meta name="twitter:image" content="https://www.zubware.com/social-card.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only load the two brand families; system fonts cover fallbacks. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=optional" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=optional" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=optional" />
    </noscript>

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('zubware-theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 dark:bg-slate-950 dark:text-slate-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
