name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install ChatGPT plugin dependencies
        run: npm ci
        working-directory: chatgpt-plugin

      - name: Build ChatGPT plugin interface
        run: npm run build
        working-directory: chatgpt-plugin
        env:
          ZUBWARE_PLUGIN_BASE: /chatgpt-plugin/

      - name: Include ChatGPT plugin in website deployment
        run: cp -R chatgpt-plugin/dist dist/chatgpt-plugin

      - name: Save IndexNow content manifest
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-manifest
          path: dist/indexnow-manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  indexnow:
    name: Notify IndexNow after successful deployment
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-manifest
          path: reports
      - name: Restore last accepted URL fingerprints
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state
          key: indexnow-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            indexnow-${{ github.ref_name }}-
      - run: node --test scripts/testIndexNow.mjs
      - name: Submit new, changed and removed canonical URLs
        run: node scripts/indexNow.mjs submit
      - name: Save accepted submission state
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state
          key: indexnow-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save submission receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-submission
          path: reports/indexnow-submission.json
          if-no-files-found: ignore
