<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 70 870 860" fill="none">
  <defs>
    <!-- Top Bar Gradient: Cyan to Royal Blue to Purple -->
    <linearGradient id="topRibbon" x1="120" y1="200" x2="880" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00a6ff" />
      <stop offset="25%" stop-color="#0077ff" />
      <stop offset="55%" stop-color="#3b49df" />
      <stop offset="85%" stop-color="#8033eb" />
      <stop offset="100%" stop-color="#9a30eb" />
    </linearGradient>

    <!-- Diagonal Ribbon: Royal Blue with rich saturation -->
    <linearGradient id="diagRibbon" x1="720" y1="320" x2="200" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="20%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="85%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#00a6ff" />
    </linearGradient>

    <!-- Bottom Bar Gradient: Royal Blue to Purple to Vivid Magenta -->
    <linearGradient id="bottomRibbon" x1="200" y1="670" x2="900" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="30%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Top Right Cylindrical Fold Deep Shadow -->
    <linearGradient id="topFoldShadow" x1="750" y1="320" x2="650" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080b2b" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#0d1445" stop-opacity="0.6" />
      <stop offset="85%" stop-color="#1e1b4b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom Under-Fold Shadow -->
    <linearGradient id="bottomFoldShadow" x1="260" y1="670" x2="480" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080b2b" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#0d1445" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#0d1445" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0d1445" stop-opacity="0" />
    </linearGradient>

    <!-- Top-Right Fold Highlight/Cap -->
    <linearGradient id="topFoldCap" x1="680" y1="96" x2="900" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8033eb" />
      <stop offset="60%" stop-color="#9a30eb" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Drop Shadow for Standalone Display -->
    <filter id="iconGlow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#2563eb" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#iconGlow)">
    <!-- 1. BOTTOM HORIZONTAL ARM (Rear Layer) with sharp 45-degree angled wedge cut on right -->
    <path
      d="M 280 668
         L 904 668
         L 760 904
         L 240 904
         C 152 904 84 836 84 748
         C 84 712 100 668 140 668
         L 280 668
         Z"
      fill="url(#bottomRibbon)"
    />

    <!-- 2. BOTTOM FOLD SHADOW -->
    <path
      d="M 140 668
         L 520 668
         L 420 780
         L 190 904
         C 140 870 84 815 84 748
         Z"
      fill="url(#bottomFoldShadow)"
    />

    <!-- 3. TOP HORIZONTAL ARM & UPPER FOLD -->
    <path
      d="M 88 320
         L 312 96
         L 750 96
         C 836 96 904 164 904 250
         C 904 336 836 404 750 404
         L 670 404
         L 240 904
         C 152 904 84 836 84 748
         C 84 700 120 630 180 560
         L 576 96
         L 312 96
         L 88 320
         Z"
      fill="url(#topRibbon)"
    />

    <!-- 4. DIAGONAL BODY (Front Ribbon Overlay with Royal Blue gradient) -->
    <path
      d="M 750 96
         C 836 96 904 164 904 250
         C 904 300 875 350 820 380
         L 240 904
         C 152 904 84 836 84 748
         C 84 700 120 630 180 560
         L 576 96
         Z"
      fill="url(#diagRibbon)"
    />

    <!-- 5. TOP INNER FOLD 3D CYLINDRICAL SHADOW -->
    <path
      d="M 710 240
         C 710 240 815 255 820 380
         C 780 400 730 404 680 404
         C 620 404 590 350 635 300
         Z"
      fill="url(#topFoldShadow)"
    />

    <!-- 6. TOP-RIGHT PURPLE FOLD CAP -->
    <path
      d="M 720 96
         L 750 96
         C 836 96 904 164 904 250
         C 904 300 875 348 830 376
         C 780 300 720 220 710 170
         Z"
      fill="url(#topFoldCap)"
    />
  </g>
</svg>