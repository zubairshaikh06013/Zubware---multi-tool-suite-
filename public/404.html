<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Page not found — Zubware</title>
    <script type="text/javascript">
      // Single Page Apps SPA redirect fallback
      // Supports root domain (https://www.zubware.com/) and legacy repo path redirection
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      
      var targetRoute = l.pathname.slice(1).replace(/&/g, '~and~');
      l.replace(
        l.protocol + '//' + l.host + '/?p=' + targetRoute +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The requested address could not be found. If the tool does not load, use the directory to find its current address.</p>
      <p><a href="/">Zubware home</a> · <a href="/categories">Browse tools</a> · <a href="/contact">Report a broken link</a></p>
    </main>
  </body>
</html>
