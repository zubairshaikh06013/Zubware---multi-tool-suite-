<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Photo Resize Guide"><rect width="1200" height="600" fill="#f5f7ff"/><rect x="36" y="36" width="1128" height="528" rx="28" fill="white"/><rect x="36" y="36" width="12" height="528" rx="6" fill="#2563eb"/><g font-family="Arial,sans-serif"><text x="84" y="104" font-size="23" font-weight="700" fill="#2563eb">ZUBWARE TOOL GUIDES</text><text x="84" y="174" font-size="44" font-weight="700" fill="#111827">Photo Resize Guide</text><text x="84" y="220" font-size="24" fill="#475569">Pixels, aspect ratio and file size are separate checks</text><rect x="84" y="274" width="328" height="178" rx="18" fill="#f1f5f9"/><text x="106" y="316" font-size="17" font-weight="700" fill="#2563eb">01 · DIMENSIONS</text><text x="106" y="368" font-size="27" font-weight="700" fill="#111827">160 × 200 px</text><text x="106" y="411" font-size="18" fill="#475569">Example: 4:5 ratio</text><rect x="436" y="274" width="328" height="178" rx="18" fill="#f1f5f9"/><text x="458" y="316" font-size="17" font-weight="700" fill="#2563eb">02 · FORMAT</text><text x="458" y="368" font-size="27" font-weight="700" fill="#111827">JPEG / JPG</text><text x="458" y="411" font-size="18" fill="#475569">Follow the portal rules</text><rect x="788" y="274" width="328" height="178" rx="18" fill="#f1f5f9"/><text x="810" y="316" font-size="17" font-weight="700" fill="#2563eb">03 · FILE SIZE</text><text x="810" y="368" font-size="27" font-weight="700" fill="#111827">Maximum 20 KB</text><text x="810" y="411" font-size="18" fill="#475569">Check any minimum too</text><text x="84" y="512" font-size="19" fill="#64748b">Practical examples · Always check the current application requirements</text></g></svg>